  <style>

    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif;font-size:14px}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.hidden{display:none!important}.muted{color:var(--muted)}.small{font-size:12px}.mono{font-variant-numeric:tabular-nums}.app{min-height:100vh}.sidebar{position:fixed;inset:0 0 0 auto;width:246px;background:#fff;border-left:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;z-index:5}.brand{display:flex;align-items:center;gap:12px;padding:5px 8px 23px;border-bottom:1px solid var(--line)}.brand-icon{width:42px;height:42px;display:grid;place-items:center;border-radius:14px;background:var(--green);color:#fff;font-size:22px}.brand strong{display:block;font-size:16px}.brand small{display:block;color:var(--muted);margin-top:4px}.nav{padding-top:18px;display:grid;gap:6px}.nav button{display:flex;align-items:center;gap:12px;border:0;background:transparent;color:#657069;padding:12px;border-radius:11px;text-align:right}.nav button:hover,.nav button.active{background:var(--mint);color:var(--green);font-weight:bold}.nav-icon{width:23px;text-align:center;font-size:17px}.side-bottom{margin-top:auto}.user-chip{border-top:1px solid var(--line);padding:16px 6px 0;display:flex;align-items:center;gap:10px}.avatar{width:36px;height:36px;border-radius:50%;background:#eef2ee;display:grid;place-items:center;color:var(--green);font-weight:bold}.user-chip .meta{flex:1;min-width:0}.user-chip .meta strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.logout{border:0;background:#fff;color:var(--muted);font-size:18px;padding:5px}.main{margin-right:246px;min-height:100vh}.topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:3}.page-title{font-size:19px;font-weight:bold}.top-actions{displa y:flex;gap:8px;margin-top:14px}.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:13px}.toolbar input{min-width:180px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:right;padding:12px 10px;border-bottom:1px solid #eef1ee;font-size:12px}th{color:#818a83;font-weight:600;background:#fafbfa}tbody tr:last-child td{border-bottom:0}.badge{display:inline-flex;border-radius:30px;padding:5px 9px;background:#eef2ee;color:#667168;font-size:11px}.badge.green{background:#e8f5ed;color:#237a52}.badge.orange{background:#fff4e6;color:#a76a1e}.badge.red{background:#fff0ef;color:#b84943}.actions{display:flex;gap:5px}.text-green{color:var(--green)}.text-red{color:var(--red)}.empty{text-align:center;color:var(--muted);padding:27px!important}.shift-box{display:flex;justify-content:space-between;align-items:center;padding:15px;border:1px solid var(--line);border-radius:12px;background:#fafcf9}.shift-state{display:flex;align-items:center;gap:10px}.dot{width:9px;height:9px;border-radius:50%;background:#bbb}.dot.open{background:#35a66a;box-shadow:0 0 0 4px #35a66a20}.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.quick{border:1px solid var(--line);border-radius:11px;padding:14px;text-align:right;background:#fff}.quick:hover{border-color:#8fbea0;background:#fbfefb}.quick span{display:block;font-size:19px;margin-bottom:9px}.quick strong{font-size:13px}.pos-layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}.product-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.product-card{border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px;text-align:right;transition:.15s}.product-card:hover{border-color:#8eb89c;transform:translateY(-1px)}.product-card:disabled{opacity:.45;transform:none}.product-symbol{width:37px;height:37px;border-radius:11px;background:#f2f6f1;display:grid;place-items:center;font-size:19px;margin-bottom:12px}.product-card strong{display:block;margin-bottom:6px}.product-card .price{color:var(--green);font-weight:bold}.product-card small{display:block;color:var(--muted);margin-top:5px}.cart-panel{position:sticky;top:92px}.cart-list{display:grid;gap:10px;max-height:330px;overflow:auto}.cart-row{display:grid;grid-template-columns:1fr auto;gap:9px;padding-bottom:10px;border-bottom:1px solid #eef1ee}.cart-row strong{display:block;font-size:12px}.cart-row small{color:var(--muted)}.qty-controls{display:flex;align-items:center;gap:7px}.qty-controls button{width:24px;height:24px;border-radius:7px;border:1px solid var(--line);background:#fff}.total-line{display:flex;justify-content:space-between;padding-top:12px;margin-top:10px}.total-line.total{font-weight:bold;font-size:17px;border-top:1px solid var(--line)}.pay-choice{display:flex;gap:8px;margin-top:14px}.pay-choice label{flex:1;border:1px solid var(--line);border-radius:9px;padding:10px;text-align:center}.pay-choice input{accent-color:var(--green)}.full-btn{width:100%;margin-top:13px}.notice{border-radius:10px;background:#f3f8f3;padding:12px;color:#58675b;font-size:12px;line-height:1.7;margin-bottom:15px}.settings-logo{display:flex;align-items:center;gap:16px}.settings-logo img{width:70px;height:70px;object-fit:contain;border:1px dashed #d6ded7;border-radius:12px;padding:5px}.report-filters{display:flex;align-items:end;gap:10px;flex-wrap:wrap}.chart{height:180px;display:flex;align-items:end;gap:10px;padding:15px 6px 0;border-bottom:1px solid var(--line)}.bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:end}.bar{width:min(32px,70%);min-height:3px;border-radius:6px 6px 0 0;background:#54a475}.bar-label{font-size:10px;color:var(--muted)}.bar-value{font-size:10px;color:#5a655c}.login-screen{position:fixed;inset:0;z-index:20;background:linear-gradient(135deg,#edf5ee,#f8f6ef);display:grid;place-items:center;padding:20px}.login-card{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:30px;box-shadow:0 25px 70px #1e332318}.login-brand{text-align:center;margin-bottom:24px}.login-brand .brand-icon{margin:auto auto 12px;width:54px;height:54px;font-size:25px}.login-brand h1{font-size:21px;margin:0 0 6px}.login-brand p{margin:0;color:var(--muted);font-size:13px}.login-form{display:grid;gap:14px}.login-error{color:var(--red);font-size:12px;min-height:16px}.demo-hint{padding:11px;border-radius:8px;background:#f5f7f5;color:#667168;font-size:11px;line-height:1.8;margin-top:16px}.toast{position:fixed;bottom:20px;left:20px;z-index:50;padding:12px 18px;border-radius:10px;background:#26372d;color:white;box-shadow:var(--shadow);animation:rise .2s ease}@keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}.modal-backdrop{position:fixed;inset:0;background:#18251d70;display:grid;place-items:center;padding:16px;z-index:30}.modal{background:#fff;border-radius:15px;padding:20px;width:min(600px,100%);max-height:90vh;overflow:auto}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modal-head h2{font-size:16px;margin:0}.close{border:0;background:#f2f4f2;border-radius:8px;width:32px;height:32px;font-size:18px}.receipt{font-family:Tahoma,Arial,sans-serif;color:#111;max-width:370px;margin:auto;padding:15px}.receipt-head{text-align:center;border-bottom:1px dashed #777;padding-bottom:12px}.receipt-head img{max-width:100px;max-height:70px;display:block;margin:0 auto 8px}.receipt-head h2{margin:5px}.receipt table{margin-top:10px}.receipt th,.receipt td{border-bottom:1px dashed #aaa;padding:8px 4px;color:#111}.receipt-total{font-weight:bold;border-top:1px dashed #555;padding-top:10px;margin-top:9px}.receipt-foot{text-align:center;font-size:12px;margin-top:18px}.mobile-menu{display:none}
    @media(max-width:1000px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.pos-layout{grid-template-columns:minmax(0,1fr) 320px}.product-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.layout-2{grid-template-columns:1fr}}
    @media(max-width:720px){.sidebar{width:74px;padding:15px 9px}.brand{justify-content:center;padding:4px 0 17px}.brand-icon{width:42px;height:42px}.brand-copy,.nav-label,.user-chip .meta,.logout{display:none}.nav button{justify-content:center;padding:13px 6px}.nav-icon{font-size:19px}.user-chip{justify-content:center;padding:14px 0 0}.main{margin-right:74px}.topbar{height:64px;padding:0 15px}.content{padding:18px 14px 34px}.page-title{font-size:16px}.pos-layout{grid-template-columns:1fr}.cart-panel{position:static;order:-1}.product-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.cards{gap:9px}.stat{padding:13px}.stat-value{font-size:18px}.quick-grid{grid-template-columns:repeat(2,1fr)}.top-actions .date-label{display:none}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}}
    @media print{body{background:#fff}.sidebar,.topbar,.content,.modal-head,.modal-backdrop{display:none!important}body.printing-receipt .modal-backdrop{display:grid!important;position:static;background:#fff;padding:0}.modal{display:none!important}body.printing-receipt #receiptModal{display:block!important;position:static!important;max-height:none!important;width:100%;padding:0;box-shadow:none}.receipt{max-width:100%;padding:0}.receipt .no-print{display:none!important}}
  </style>
</head>
<body>
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <div class="login-brand"><div class="brand-icon">♨</div><h1 id="loginRestaurantName">نظام إدارة المطعم</h1><p>سجّل الدخول للبدء بإدارة يومك</p></div>
      <form id="loginForm" class="login-form">
        <div class="field"><label for="loginUsername">اسم المستخدم</label><input id="loginUsername" autocomplete="username" required placeholder="أدخل اسم المستخدم"></div>
        <div class="field"><label for="loginPassword">كلمة المرور</label><input id="loginPassword" type="password" autocomplete="current-password" required placeholder="أدخل كلمة المرور"></div>
        <div id="loginError" class="login-error"></div>
        <button class="btn btn-primary" type="submit">تسجيل الدخول</button>
      </form>
      <div class="demo-hint">حساب تجريبي أولي: <b>admin</b> / <b>admin1234</b><br>غيّر كلمة المرور بعد الدخول من إدارة المستخدمين.</div>
    </div>
  </div>
  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand"><div class="brand-icon">♨</div><div class="brand-copy"><strong id="sideRestaurantName">مطعمي</strong><small>نظام إدارة المطعم</small></div></div>
      <nav class="nav" id="mainNav">
        <button class="active" data-page="dashboard"><span class="nav-icon">▦</span><span class="nav-label">لوحة التحكم</span></button>
        <button data-page="pos"><span class="nav-icon">▣</span><span class="nav-label">نقطة البيع</span></button>
        <button data-page="products"><span class="nav-icon">◫</span><span class="nav-label">المنتجات والمخزون</span></button>
        <button data-page="expenses"><span class="nav-icon">↙</span><span class="nav-label">المصروفات</span></button>
        <button data-page="reports"><span class="nav-icon">▤</span><span class="nav-label">التقارير المالية</span></button>
        <button data-page="users"><span class="nav-icon">♙</span><span class="nav-label">إدارة المستخدمين</span></button>
        <button data-page="settings"><span class="nav-icon">⚙</span><span class="nav-label">الإعدادات</span></button>
      </nav>
      <div class="side-bottom"><div class="user-chip"><div id="userAvatar" class="avatar">م</div><div class="meta"><strong id="currentUserName">مستخدم</strong><span class="small muted" id="currentUserRole">مدير</span></div><button class="logout" id="logoutBtn" title="تسجيل الخروج">↪</button></div></div>
    </aside>
    <main class="main">
      <header class="topbar"><div id="pageTitle" class="page-title">لوحة التحكم</div><div class="top-actions"><span class="date-label small muted" id="todayLabel"></span><button id="topLogoutBtn" class="btn btn-sm">تسجيل الخروج</button></div></header>
      <div id="pageContent" class="content"></div>
    </main>
  </div>
  <div id="modalHost"></div>
  <div id="toastHost"></div>
  <script>
  (()=>{
    'use strict';
    const KEY='mat3am_system_v1';
    const today=()=>new Date().toISOString().slice(0,10);
    const makeId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
    const starter={
      settings:{name:'مطعمي',details:'',phone:'',currency:'ج.م',logo:''},
      users:[{id:'u-admin',username:'admin',name:'مدير المطعم',password:'admin1234',role:'مدير',active:true}],
      products:[
        {id:'p1',name:'برجر كلاسيك',price:125,stock:25,kind:'وجبة',emoji:'🍔'},
        {id:'p2',name:'بيتزا خضار',price:160,stock:18,kind:'وجبة',emoji:'🍕'},
        {id:'p3',name:'بطاطس مقلية',price:55,stock:40,kind:'جانبي',emoji:'🍟'},
        {id:'p4',name:'سلطة خضراء',price:45,stock:22,kind:'جانبي',emoji:'🥗'},
        {id:'p5',name:'عصير برتقال',price:35,stock:30,kind:'مشروب',emoji:'🧃'},
        {id:'p6',name:'مياه معدنية',price:15,stock:60,kind:'مشروب',emoji:'💧'}
      ],expenses:[],sales:[],shifts:[],currentShift:null
    };
    let data=loadData(),currentUser=null,currentPage='dashboard',cart=[],reportPeriod='day';
    function loadData(){try{const x=JSON.parse(localStorage.getItem(KEY));return x&&x.users&&x.products?{...starter,...x,settings:{...starter.settings,...x.settings}}:structuredClone(starter)}catch{return structuredClone(starter)}}
    function save(){localStorage.setItem(KEY,JSON.stringify(data))}
    const $=s=>document.querySelector(s);
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const money=n=>`${Number(n||0).toLocaleString('ar-EG',{maximumFractionDigits:2})} ${esc(data.settings.currency||'ج.م')}`;
    const dateText=d=>{if(!d)return '—';try{return new Date(d+'T12:00:00').toLocaleDateString('ar-EG')}catch{return d}};
    const nowText=()=>new Date().toLocaleString('ar-EG');
    const roleLabel=r=>r==='مدير'?'مدير':'كاشير';
    function toast(msg){const host=$('#toastHost');host.innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>host.innerHTML='',2600)}
    function setPage(name){currentPage=name;document.querySelectorAll('#mainNav button').forEach(b=>b.classList.toggle('active',b.dataset.page===name));renderPage()}
    function cashTotal(sales){return sales.reduce((a,s)=>a+Number(s.total||0),0)}
    function activeSales(date=today()){return data.sales.filter(s=>s.date===date)}
    function dateExpenses(date=today()){return data.expenses.filter(e=>e.date===date)}
    function shiftButton(){if(data.currentShift)return `<div class="shift-box"><div class="shift-state"><span class="dot open"></span><div><strong>الوردية مفتوحة</strong><div class="small muted">بدأت ${esc(data.currentShift.startedAt)}</div></div></div><button class="btn btn-danger btn-sm" onclick="closeShift()">قفل الوردية</button></div>`;return `<div class="shift-box"><div class="shift-state"><span class="dot"></span><div><strong>لا توجد وردية مفتوحة</strong><div class="small muted">افتح وردية لتسجيل عمليات البيع</div></div></div><button class="btn btn-primary btn-sm" onclick="openShift()">فتح الوردية</button></div>`}
    function dashboard(){const sales=activeSales(),expenses=dateExpenses(),gross=cashTotal(sales),cost=expenses.reduce((a,e)=>a+Number(e.amount),0),net=gross-cost;return `
      <div class="cards">
        <div class="card stat"><div class="stat-top">مبيعات اليوم <span class="stat-icon">↗</span></div><div class="stat-value">${money(gross)}</div><div class="stat-foot">${sales.length} عملية بيع اليوم</div></div>
        <div class="card stat"><div class="stat-top">مصروفات اليوم <span class="stat-icon">↙</span></div><div class="stat-value">${money(cost)}</div><div class="stat-foot">${expenses.length} مصروف مسجل</div></div>
        <div class="card stat"><div class="stat-top">صافي اليوم <span class="stat-icon">◈</span></div><div class="stat-value ${net<0?'text-red':'text-green'}">${money(net)}</div><div class="stat-foot">المبيعات ناقص المصروفات</div></div>
        <div class="card stat"><div class="stat-top">المنتجات <span class="stat-icon">◫</span></div><div class="stat-value">${data.products.length}</div><div class="stat-foot">${data.products.filter(p=>Number(p.stock)<=5).length} منتجات مخزونها منخفض</div></div>
      </div>
      <div class="panel"><div class="panel-head"><div><h2>إدارة الوردية</h2><p>تابع حالة وردية الكاشير الحالية</p></div></div>${shiftButton()}</div>
      <div class="layout-2"><section class="panel"><div class="panel-head"><div><h2>آخر المبيعات</h2><p>أحدث عمليات البيع المسجلة</p></div><button class="btn btn-sm" onclick="setPage('reports')">عرض التقارير</button></div>${salesTable(data.sales.slice().reverse().slice(0,5))}</section>
      <section class="panel"><div class="panel-head"><div><h2>اختصارات سريعة</h2><p>الوصول إلى المهام المتكررة</p></div></div><div class="quick-grid"><button class="quick" onclick="setPage('pos')"><span>▣</span><strong>نقطة البيع</strong></button><button class="quick" onclick="setPage('expenses')"><span>↙</span><strong>إضافة مصروف</strong></button><button class="quick" onclick="setPage('products')"><span>◫</span><strong>إضافة منتج</strong></button><button class="quick" onclick="setPage('reports')"><span>▤</span><strong>التقارير</strong></button><button class="quick" onclick="setPage('settings')"><span>⚙</span><strong>بيانات المنشأة</strong></button><button class="quick" onclick="setPage('users')"><span>♙</span><strong>المستخدمون</strong></button></div></section></div>`}
    function salesTable(rows){if(!rows.length)return '<div class="empty">لا توجد مبيعات مسجلة بعد</div>';return `<div class="table-wrap"><table><thead><tr><th>رقم العملية</th><th>التاريخ</th><th>الإجمالي</th><th>الدفع</th><th>الكاشير</th><th></th></tr></thead><tbody>${rows.map(s=>`<tr><td>#${esc(s.id.slice(-6).toUpperCase())}</td><td>${dateText(s.date)}</td><td>${money(s.total)}</td><td><span class="badge ${s.payment==='بنك'?'orange':'green'}">${esc(s.payment)}</span></td><td>${esc(s.cashier)}</td><td><button class="btn btn-sm" onclick="showReceipt('${esc(s.id)}')">الإيصال</button></td></tr>`).join('')}</tbody></table></div>`}
    function posPage(){return `<div class="pos-layout"><section class="panel"><div class="panel-head"><div><h2>اختيار المنتجات</h2><p>اضغط على المنتج لإضافته إلى الفاتورة</p></div><span class="badge">${data.products.length} منتج</span></div><div class="product-grid">${data.products.map(p=>`<button class="product-card" ${p.stock<=0?'disabled':''} onclick="addCart('${esc(p.id)}')"><span class="product-symbol">${esc(p.emoji||'🍽️')}</span><strong>${esc(p.name)}</strong><span class="price">${money(p.price)}</span><small>المتاح: ${Number(p.stock)}</small></button>`).join('')||'<div class="empty">أضف منتجات أولاً من إدارة المنتجات</div>'}</div></section>
      <section class="panel cart-panel"><div class="panel-head"><div><h2>الفاتورة الحالية</h2><p>مراجعة الطلب قبل إتمام البيع</p></div><button class="btn btn-sm" onclick="clearCart()">مسح</button></div><div id="cartItems" class="cart-list"></div><div id="cartTotals"></div><div class="pay-choice"><label><input type="radio" name="payment" value="cash" checked> cash</label><label><input type="radio" name="payment" value="بنك"> بنك</label></div><button class="btn btn-primary full-btn" id="checkoutBtn" onclick="checkout()">إتمام البيع</button></section></div>`}
    function renderCart(){const box=$('#cartItems'),totals=$('#cartTotals');if(!box||!totals)return;const items=cart.map(i=>{const p=data.products.find(x=>x.id===i.id);return p?{...p,qty:i.qty}:null}).filter(Boolean);box.innerHTML=items.length?items.map(i=>`<div class="cart-row"><div><strong>${esc(i.name)}</strong><small>${money(i.price)} × ${i.qty}</small></div><div class="qty-controls"><button onclick="changeQty('${esc(i.id)}',-1)">−</button><b>${i.qty}</b><button onclick="changeQty('${esc(i.id)}',1)">+</button></div></div>`).join(''):'<div class="empty">الفاتورة فارغة</div>';const total=items.reduce((a,i)=>a+i.price*i.qty,0);totals.innerHTML=`<div class="total-line"><span>عدد الأصناف</span><span>${items.reduce((a,i)=>a+i.qty,0)}</span></div><div class="total-line total"><span>الإجمالي</span><span>${money(total)}</span></div>`;$('#checkoutBtn').disabled=!items.length}
    function addCart(id){const p=data.products.find(x=>x.id===id);if(!p||p.stock<=0)return toast('المنتج غير متوفر بالمخزون');const row=cart.find(x=>x.id===id);if(row&&row.qty>=p.stock)return toast('الكمية المطلوبة أكبر من المخزون');row?row.qty++:cart.push({id,qty:1});renderCart()}
    function changeQty(id,delta){const row=cart.find(x=>x.id===id),p=data.products.find(x=>x.id===id);if(!row)return;row.qty+=delta;if(row.qty<=0)cart=cart.filter(x=>x.id!==id);if(p&&row.qty>p.stock){row.qty=p.stock;toast('لا توجد كمية إضافية بالمخزون')}renderCart()}
    function clearCart(){cart=[];renderCart()}
    function checkout(){if(!data.currentShift)return toast('افتح الوردية أولاً قبل تسجيل البيع');if(!cart.length)return;const items=cart.map(i=>{const p=data.products.find(x=>x.id===i.id);return {productId:p.id,name:p.name,price:Number(p.price),qty:i.qty,subtotal:Number(p.price)*i.qty}});if(items.some(i=>data.products.find(p=>p.id===i.productId).stock<i.qty))return toast('راجع الكميات المتاحة في المخزون');const sale={id:makeId(),date:today(),createdAt:nowText(),items,total:items.reduce((a,i)=>a+i.subtotal,0),payment:document.querySelector('input[name="payment"]:checked')?.value==='cash'?'cash':'بنك',cashier:currentUser.name,shiftId:data.currentShift.id};items.forEach(i=>{const p=data.products.find(x=>x.id===i.productId);p.stock-=i.qty});data.sales.push(sale);save();cart=[];renderCart();showReceipt(sale.id);toast('تم تسجيل البيع بنجاح')}
    function expensesPage(){return `<div class="layout-2"><section class="panel"><div class="panel-head"><div><h2>تسجيل مصروف جديد</h2><p>أدخل تفاصيل المصروف لإضافته إلى السجل</p></div></div><form id="expenseForm"><div class="fields"><div class="field full"><label>بيان المصروف</label><input name="description" required placeholder="مثال: مشتريات خضار"></div><div class="field"><label>المبلغ</label><input name="amount" type="number" min="0.01" step="0.01" required></div><div class="field"><label>التاريخ</label><input name="date" type="date" value="${today()}" required></div><div class="field full"><label>ملاحظات (اختياري)</label><textarea name="notes" placeholder="أضف تفاصيل إضافية"></textarea></div></div><div class="form-actions"><button class="btn btn-primary">حفظ المصروف</button></div></form></section><section class="panel"><div class="panel-head"><div><h2>ملخص المصروفات</h2><p>إجمالي المصروفات المسجلة</p></div></div><div class="stat-value">${money(data.expenses.reduce((a,e)=>a+Number(e.amount),0))}</div><div class="stat-foot">${data.expenses.length} مصروف</div></section></div>
      <section class="panel"><div class="panel-head"><div><h2>سجل المصروفات</h2><p>كل المصروفات المسجلة في النظام</p></div><button class="btn btn-sm" onclick="window.print()">طباعة / PDF</button></div>${expensesTable(data.expenses.slice().reverse())}</section>`}
    function expensesTable(rows){if(!rows.length)return '<div class="empty">لا توجد مصروفات مسجلة</div>';return `<div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>البيان</th><th>الملاحظات</th><th>المبلغ</th><th>المسجل بواسطة</th><th></th></tr></thead><tbody>${rows.map(e=>`<tr><td>${dateText(e.date)}</td><td>${esc(e.description)}</td><td>${esc(e.notes||'—')}</td><td>${money(e.amount)}</td><td>${esc(e.user)}</td><td><button class="btn btn-sm btn-danger" onclick="deleteExpense('${esc(e.id)}')">حذف</button></td></tr>`).join('')}</tbody></table></div>`}
    function productsPage(){return `<section class="panel"><div class="panel-head"><div><h2>إضافة منتج</h2><p>أدخل بيانات المنتج والسعر والكمية ونوع المخزون</p></div></div><form id="productForm"><div class="fields"><div class="field"><label>اسم المنتج</label><input name="name" required placeholder="اسم المنتج"></div><div class="field"><label>السعر</label><input name="price" type="number" min="0" step="0.01" required></div><div class="field"><label>الكمية بالمخزون</label><input name="stock" type="number" min="0" step="1" required></div><div class="field"><label>نوع المخزون / التصنيف</label><select name="kind"><option>وجبة</option><option>مشروب</option><option>جانبي</option><option>مكونات</option><option>أخرى</option></select></div><div class="field"><label>رمز المنتج (إيموجي اختياري)</label><input name="emoji" maxlength="8" placeholder="🍽️"></div></div><div class="form-actions"><button class="btn btn-primary">إضافة المنتج</button></div></form></section>
      <section class="panel"><div class="panel-head"><div><h2>قائمة المنتجات والمخزون</h2><p>يمكن تعديل السعر والكمية أو حذف المنتج</p></div></div><div class="table-wrap"><table><thead><tr><th>المنتج</th><th>التصنيف</th><th>السعر</th><th>الكمية</th><th>حالة المخزون</th><th>الإجراءات</th></tr></thead><tbody>${data.products.map(p=>`<tr><td>${esc(p.emoji||'🍽️')}　${esc(p.name)}</td><td>${esc(p.kind)}</td><td>${money(p.price)}</td><td>${p.stock}</td><td><span class="badge ${p.stock<=5?'red':p.stock<=10?'orange':'green'}">${p.stock<=5?'منخفض':p.stock<=10?'قارب على النفاد':'متوفر'}</span></td><td><div class="actions"><button class="btn btn-sm" onclick="editProduct('${esc(p.id)}')">تعديل</button><button class="btn btn-sm btn-danger" onclick="deleteProduct('${esc(p.id)}')">حذف</button></div></td></tr>`).join('')||'<tr><td colspan="6" class="empty">لا توجد منتجات</td></tr>'}</tbody></table></div></section>`}
    function usersPage(){return `<div class="notice">أنشئ حسابًا لكل موظف يحتاج إلى دخول النظام. يمكنك تعيين دوره كمدير أو كاشير. الحسابات في هذه النسخة محفوظة في هذا المتصفح فقط.</div><section class="panel"><div class="panel-head"><div><h2>إضافة مستخدم جديد</h2><p>أنشئ بيانات دخول لموظف المطعم</p></div></div><form id="userForm"><div class="fields"><div class="field"><label>الاسم الظاهر</label><input name="name" required></div><div class="field"><label>اسم المستخدم</label><input name="username" required minlength="3" autocomplete="off"></div><div class="field"><label>كلمة المرور</label><input name="password" type="password" required minlength="6" autocomplete="new-password"></div><div class="field"><label>الدور</label><select name="role"><option>كاشير</option><option>مدير</option></select></div></div><div class="form-actions"><button class="btn btn-primary">إنشاء الحساب</button></div></form></section><section class="panel"><div class="panel-head"><div><h2>المستخدمون</h2><p>الحسابات المسجلة في النظام</p></div></div><div class="table-wrap"><table><thead><tr><th>الاسم</th><th>اسم المستخدم</th><th>الدور</th><th>الحالة</th><th>الإجراءات</th></tr></thead><tbody>${data.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.username)}</td><td>${esc(roleLabel(u.role))}</td><td><span class="badge ${u.active?'green':'red'}">${u.active?'نشط':'موقوف'}</span></td><td><div class="actions">${u.id!==currentUser.id?`<button class="btn btn-sm" onclick="toggleUser('${esc(u.id)}')">${u.active?'إيقاف':'تفعيل'}</button><button class="btn btn-sm btn-danger" onclick="deleteUser('${esc(u.id)}')">حذف</button>`:'<span class="muted small">الحساب الحالي</span>'}</div></td></tr>`).join('')}</tbody></table></div></section>`}
    function settingsPage(){return `<section class="panel"><div class="panel-head"><div><h2>بيانات المنشأة</h2><p>ستظهر هذه البيانات على إيصالات البيع</p></div></div><form id="settingsForm"><div class="fields"><div class="field"><label>اسم المنشأة</label><input name="name" required value="${esc(data.settings.name)}"></div><div class="field"><label>رقم الهاتف</label><input name="phone" value="${esc(data.settings.phone)}" placeholder="اختياري"></div><div class="field"><label>العملة</label><input name="currency" value="${esc(data.settings.currency)}" placeholder="ج.م"></div><div class="field"><label>تفاصيل المنشأة</label><input name="details" value="${esc(data.settings.details)}" placeholder="العنوان أو بيانات إضافية"></div><div class="field full"><label>شعار المنشأة (يمكن اختياره من الهاتف)</label><div class="settings-logo">${data.settings.logo?`<img src="${data.settings.logo}" alt="شعار المنشأة">`:'<div class="stat-icon" style="width:70px;height:70px">♨</div>'}<input name="logo" type="file" accept="image/*"></div><span class="small muted">يتم حفظ الصورة داخل بيانات المتصفح. استخدم صورة صغيرة لتقليل المساحة.</span></div></div><div class="form-actions"><button class="btn btn-primary">حفظ الإعدادات</button><button type="button" class="btn" onclick="exportBackup()">تنزيل نسخة بيانات JSON</button><button type="button" class="btn btn-danger" onclick="resetData()">إعادة ضبط بيانات النظام</button></div></form></section><div class="notice">للطباعة أو الحفظ كـ PDF: اختر طباعة الإيصال أو التقرير، ثم اختر «Save as PDF / حفظ كملف PDF» من نافذة الطباعة في المتصفح.</div>`}
    function reportsPage(){return `<section class="panel"><div class="panel-head"><div><h2>التقارير المالية</h2><p>ملخص المبيعات والمصروفات وصافي الدخل</p></div><button class="btn btn-sm" onclick="window.print()">طباعة / حفظ PDF</button></div><div class="report-filters"><div class="field"><label>نوع التقرير</label><select id="reportPeriod"><option value="day" ${reportPeriod==='day'?'selected':''}>يومي</option><option value="month" ${reportPeriod==='month'?'selected':''}>شهري</option></select></div><div class="field"><label>التاريخ المرجعي</label><input id="reportDate" type="date" value="${today()}"></div><button class="btn btn-primary" onclick="updateReport()">عرض التقرير</button></div></section><div id="reportResult"></div>`}
    function reportData(){const period=$('#reportPeriod')?.value||reportPeriod,date=$('#reportDate')?.value||today();reportPeriod=period;const match=d=>period==='month'?d?.slice(0,7)===date.slice(0,7):d===date;const sales=data.sales.filter(s=>match(s.date)),expenses=data.expenses.filter(e=>match(e.date));const revenue=cashTotal(sales),cost=expenses.reduce((a,e)=>a+Number(e.amount),0);return {period,date,sales,expenses,revenue,cost,net:revenue-cost}}
    function updateReport(){const el=$('#reportResult');if(!el)return;const r=reportData();const banks=r.sales.filter(s=>s.payment==='بنك').reduce((a,s)=>a+s.total,0),cash=r.sales.filter(s=>s.payment==='cash').reduce((a,s)=>a+s.total,0);el.innerHTML=`<div class="cards"><div class="card stat"><div class="stat-top">إجمالي المبيعات<span class="stat-icon">↗</span></div><div class="stat-value">${money(r.revenue)}</div><div class="stat-foot">${r.sales.length} عملية بيع</div></div><div class="card stat"><div class="stat-top">المصروفات<span class="stat-icon">↙</span></div><div class="stat-value">${money(r.cost)}</div><div class="stat-foot">${r.expenses.length} مصروف</div></div><div class="card stat"><div class="stat-top">صافي الدخل<span class="stat-icon">◈</span></div><div class="stat-value ${r.net<0?'text-red':'text-green'}">${money(r.net)}</div><div class="stat-foot">المبيعات − المصروفات</div></div><div class="card stat"><div class="stat-top">مبيعات بنك / cash<span class="stat-icon">▤</span></div><div class="stat-value" style="font-size:16px">${money(banks)} / ${money(cash)}</div><div class="stat-foot">بنك / cash على الترتيب</div></div></div><section class="panel"><div class="panel-head"><div><h2>تفاصيل التقرير ${r.period==='day'?'اليومي':'الشهري'}</h2><p>${r.period==='day'?dateText(r.date):esc(r.date.slice(0,7))}</p></div></div>${salesTable(r.sales.slice().reverse())}</section><section class="panel"><div class="panel-head"><div><h2>مصروفات الفترة</h2></div></div>${expensesTable(r.expenses.slice().reverse())}</section>`}
    function renderPage(){const titles={dashboard:'لوحة التحكم',pos:'نقطة البيع',products:'المنتجات والمخزون',expenses:'المصروفات',reports:'التقارير المالية',users:'إدارة المستخدمين',settings:'الإعدادات'};$('#pageTitle').textContent=titles[currentPage]||'نظام المطعم';const c=$('#pageContent');const views={dashboard,pos:posPage,products:productsPage,expenses:expensesPage,reports:reportsPage,users:usersPage,settings:settingsPage};c.innerHTML=(views[currentPage]||dashboard)();if(currentPage==='pos')renderCart();if(currentPage==='reports')updateReport();bindForms()}
    function bindForms(){const ef=$('#expenseForm');if(ef)ef.onsubmit=e=>{e.preventDefault();const f=new FormData(ef);data.expenses.push({id:makeId(),description:f.get('description').trim(),amount:Number(f.get('amount')),date:f.get('date'),notes:f.get('notes').trim(),user:currentUser.name});save();toast('تم حفظ المصروف');renderPage()};const pf=$('#productForm');if(pf)pf.onsubmit=e=>{e.preventDefault();const f=new FormData(pf);data.products.push({id:makeId(),name:f.get('name').trim(),price:Number(f.get('price')),stock:Number(f.get('stock')),kind:f.get('kind'),emoji:f.get('emoji')||'🍽️'});save();toast('تمت إضافة المنتج');renderPage()};const uf=$('#userForm');if(uf)uf.onsubmit=e=>{e.preventDefault();const f=new FormData(uf),username=f.get('username').trim();if(data.users.some(u=>u.username.toLowerCase()===username.toLowerCase()))return toast('اسم المستخدم مستخدم بالفعل');data.users.push({id:makeId(),name:f.get('name').trim(),username,password:f.get('password'),role:f.get('role'),active:true});save();toast('تم إنشاء المستخدم');renderPage()};const sf=$('#settingsForm');if(sf)sf.onsubmit=async e=>{e.preventDefault();const f=new FormData(sf);data.settings.name=f.get('name').trim();data.settings.phone=f.get('phone').trim();data.settings.details=f.get('details').trim();data.settings.currency=f.get('currency').trim()||'ج.م';const file=f.get('logo');if(file&&file.size){if(file.size>900000)return toast('حجم الشعار كبير؛ اختر صورة أصغر من 900 كيلوبايت');data.settings.logo=await fileToDataUrl(file)}save();syncBrand();toast('تم حفظ الإعدادات');renderPage()}}
    function fileToDataUrl(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
    function syncBrand(){$('#sideRestaurantName').textContent=data.settings.name;$('#loginRestaurantName').textContent=data.settings.name||'نظام إدارة المطعم'}
    function openShift(){if(data.currentShift)return toast('هناك وردية مفتوحة بالفعل');data.currentShift={id:makeId(),startedAt:nowText(),startedBy:currentUser.name};save();toast('تم فتح الوردية');renderPage()}
    function closeShift(){if(!data.currentShift)return;const s=data.currentShift;const sales=data.sales.filter(x=>x.shiftId===s.id);const shift={...s,closedAt:nowText(),closedBy:currentUser.name,salesTotal:cashTotal(sales),salesCount:sales.length,expensesTotal:data.expenses.filter(e=>e.date===today()).reduce((a,e)=>a+Number(e.amount),0)};data.shifts.push(shift);data.currentShift=null;save();toast(`أُغلقت الوردية — المبيعات ${money(shift.salesTotal)}`);renderPage()}
    function showReceipt(id){const s=data.sales.find(x=>x.id===id);if(!s)return;const settings=data.settings;const logo=settings.logo?`<img src="${settings.logo}" alt="الشعار">`:'';$('#modalHost').innerHTML=`<div id="receiptModal" class="modal-backdrop"><div class="modal"><div class="modal-head"><h2>إيصال البيع</h2><button class="close" onclick="closeModal()">×</button></div><div class="receipt"><div class="receipt-head">${logo}<h2>${esc(settings.name)}</h2><div>${esc(settings.details||'')}</div><div>${settings.phone?`هاتف: ${esc(settings.phone)}`:''}</div><p>إيصال كاشير / فاتورة</p><div>رقم: #${esc(s.id.slice(-6).toUpperCase())}</div><div>${esc(s.createdAt)}</div></div><table><thead><tr><th>الصنف</th><th>الكمية</th><th>الإجمالي</th></tr></thead><tbody>${s.items.map(i=>`<tr><td>${esc(i.name)}<br><small>${money(i.price)}</small></td><td>${i.qty}</td><td>${money(i.subtotal)}</td></tr>`).join('')}</tbody></table><div class="receipt-total">الإجمالي: ${money(s.total)}</div><div class="receipt-foot">طريقة الدفع: ${esc(s.payment)}<br>الكاشير: ${esc(s.cashier)}<br><br>شكراً لزيارتكم</div><div class="no-print" style="text-align:center;margin-top:18px"><button class="btn btn-primary" onclick="printReceipt()">طباعة / حفظ PDF</button> <button class="btn" onclick="closeModal()">إغلاق</button></div></div></div></div>`}
    function printReceipt(){document.body.classList.add('printing-receipt');window.print();setTimeout(()=>document.body.classList.remove('printing-receipt'),800)}
    function closeModal(){document.body.classList.remove('printing-receipt');$('#modalHost').innerHTML=''}
    function editProduct(id){const p=data.products.find(x=>x.id===id);if(!p)return;$('#modalHost').innerHTML=`<div class="modal-backdrop"><div class="modal"><div class="modal-head"><h2>تعديل المنتج</h2><button class="close" onclick="closeModal()">×</button></div><form id="editProductForm"><div class="fields"><div class="field full"><label>اسم المنتج</label><input name="name" required value="${esc(p.name)}"></div><div class="field"><label>السعر</label><input name="price" type="number" min="0" step=".01" value="${p.price}" required></div><div class="field"><label>الكمية</label><input name="stock" type="number" min="0" value="${p.stock}" required></div><div class="field"><label>التصنيف</label><input name="kind" value="${esc(p.kind)}"></div></div><div class="form-actions"><button class="btn btn-primary">حفظ التعديل</button></div></form></div></div>`;$('#editProductForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);Object.assign(p,{name:f.get('name').trim(),price:Number(f.get('price')),stock:Number(f.get('stock')),kind:f.get('kind').trim()});save();closeModal();renderPage();toast('تم تعديل المنتج')}}
    function deleteProduct(id){const p=data.products.find(x=>x.id===id);if(p&&confirm(`حذف المنتج «${p.name}»؟`)){data.products=data.products.filter(x=>x.id!==id);save();renderPage();toast('تم حذف المنتج')}}
    function deleteExpense(id){if(confirm('هل تريد حذف هذا المصروف؟')){data.expenses=data.expenses.filter(e=>e.id!==id);save();renderPage();toast('تم حذف المصروف')}}
    function toggleUser(id){const u=data.users.find(x=>x.id===id);if(u){u.active=!u.active;save();renderPage();toast(u.active?'تم تفعيل المستخدم':'تم إيقاف المستخدم')}}
    function deleteUser(id){const u=data.users.find(x=>x.id===id);if(u&&confirm(`حذف المستخدم «${u.name}»؟`)){data.users=data.users.filter(x=>x.id!==id);save();renderPage();toast('تم حذف المستخدم')}}
    function updateReport(){const period=$('#reportPeriod')?.value||reportPeriod;reportPeriod=period;const date=$('#reportDate')?.value||today();const el=$('#reportResult');if(!el)return;const match=d=>period==='month'?d?.slice(0,7)===date.slice(0,7):d===date;const sales=data.sales.filter(s=>match(s.date)),expenses=data.expenses.filter(e=>match(e.date));const revenue=cashTotal(sales),cost=expenses.reduce((a,e)=>a+Number(e.amount),0),banks=sales.filter(s=>s.payment==='بنك').reduce((a,s)=>a+s.total,0),cash=sales.filter(s=>s.payment==='cash').reduce((a,s)=>a+s.total,0);el.innerHTML=`<div class="cards"><div class="card stat"><div class="stat-top">إجمالي المبيعات<span class="stat-icon">↗</span></div><div class="stat-value">${money(revenue)}</div><div class="stat-foot">${sales.length} عملية بيع</div></div><div class="card stat"><div class="stat-top">المصروفات<span class="stat-icon">↙</span></div><div class="stat-value">${money(cost)}</div><div class="stat-foot">${expenses.length} مصروف</div></div><div class="card stat"><div class="stat-top">صافي الدخل<span class="stat-icon">◈</span></div><div class="stat-value ${revenue-cost<0?'text-red':'text-green'}">${money(revenue-cost)}</div><div class="stat-foot">المبيعات ناقص المصروفات</div></div><div class="card stat"><div class="stat-top">بنك / cash<span class="stat-icon">▤</span></div><div class="stat-value" style="font-size:16px">${money(banks)} / ${money(cash)}</div><div class="stat-foot">بنك / cash على الترتيب</div></div></div><section class="panel"><div class="panel-head"><div><h2>تفاصيل المبيعات</h2><p>${period==='day'?dateText(date):esc(date.slice(0,7))}</p></div></div>${salesTable(sales.slice().reverse())}</section><section class="panel"><div class="panel-head"><div><h2>مصروفات الفترة</h2></div></div>${expensesTable(expenses.slice().reverse())}</section>`}
    function exportBackup(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='restaurant-data-backup.json';a.click();URL.revokeObjectURL(a.href)}
    function resetData(){if(!confirm('سيتم حذف بيانات هذا المتصفح وإعادة النظام إلى بيانات البداية. هل أنت متأكد؟'))return;localStorage.removeItem(KEY);data=structuredClone(starter);save();toast('تمت إعادة ضبط البيانات');location.reload()}
    function logout(){currentUser=null;cart=[];$('#app').classList.add('hidden');$('#loginScreen').classList.remove('hidden');$('#loginPassword').value='';$('#loginError').textContent=''}
    $('#loginForm').addEventListener('submit',e=>{e.preventDefault();const username=$('#loginUsername').value.trim().toLowerCase(),password=$('#loginPassword').value;const user=data.users.find(u=>u.username.toLowerCase()===username&&u.password===password&&u.active);if(!user){$('#loginError').textContent='اسم المستخدم أو كلمة المرور غير صحيحة، أو الحساب موقوف.';return}currentUser=user;$('#loginScreen').classList.add('hidden');$('#app').classList.remove('hidden');$('#currentUserName').textContent=user.name;$('#currentUserRole').textContent=roleLabel(user.role);$('#userAvatar').textContent=(user.name||'م').trim().charAt(0);$('#todayLabel').textContent=new Date().toLocaleDateString('ar-EG',{weekday:'long',year:'numeric',month:'long',day:'numeric'});syncBrand();setPage('dashboard')});
    $('#mainNav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b)setPage(b.dataset.page)});$('#logoutBtn').onclick=logout;$('#topLogoutBtn').onclick=logout;
    window.setPage=setPage;window.addCart=addCart;window.changeQty=changeQty;window.clearCart=clearCart;window.checkout=checkout;window.openShift=openShift;window.closeShift=closeShift;window.showReceipt=showReceipt;window.closeModal=closeModal;window.printReceipt=printReceipt;window.editProduct=editProduct;window.deleteProduct=deleteProduct;window.deleteExpense=deleteExpense;window.toggleUser=toggleUser;window.deleteUser=deleteUser;window.exportBackup=exportBackup;window.resetData=resetData;window.updateReport=updateReport;
    syncBrand();
  })();
  </script>
</body>
